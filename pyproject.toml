[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017", "E402"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = [
  "plugins/jakeshea-humanize-rlcr/controller",
  "plugins/jakeshea-humanize-rlcr/scripts",
  "plugins/jakeshea-humanize-rlcr/skills/humanize-plan/scripts",
  "plugins/jakeshea-humanize-rlcr/skills/humanize-review/scripts",
  "plugins/jakeshea-humanize-rlcr/skills/humanize-rlcr/scripts",
]
